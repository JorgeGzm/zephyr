description: |
  GigaDevice GD32 "v2" I2C controller (TIMINGR / NBYTES / AUTOEND, as found on
  the GD32VW55x). Distinct from "gd,gd32-i2c", which is the classic controller.

compatible: "gd,gd32-i2c-v2"

include: [i2c-controller.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  resets:
    required: true

  clocks:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
