# GD32VW553K-START, on-board GD-Link probe (CMSIS-DAP, JTAG).
# Requires the GigaDevice OpenOCD fork: the mainline openocd does not have
# the gd32vw55x flash driver.

adapter driver cmsis-dap

adapter speed 10000
reset_config trst_only
adapter srst pulse_width 100

transport select jtag

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10307a6d

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 20480 \
	-work-area-backup 0

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME gd32vw55x 0x08000000 0 0 0 $_TARGETNAME

riscv set_reset_timeout_sec 1
